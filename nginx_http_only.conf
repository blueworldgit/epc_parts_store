# Nginx configuration for vanparts-direct.co.uk - HTTP ONLY (before SSL setup)
# This version works without SSL certificates for initial testing

server {
    listen 80;
    server_name vanparts-direct.co.uk www.vanparts-direct.co.uk maxusparts.co.uk www.maxusparts.co.uk 80.95.207.45;
    
    # Document root (for Let's Encrypt later)
    root /var/www/html;
    
    # Favicon handling
    location /favicon.ico {
        alias /home/maxis/epc_parts_store/epcdata/staticfiles/favicon.ico;
        expires 1y;
        add_header Cache-Control "public, immutable";
        log_not_found off;
    }
    
    # Static files - Django collected static files
    location /static/ {
        alias /home/maxis/epc_parts_store/epcdata/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        
        # Gzip compression for static files
        gzip on;
        gzip_vary on;
        gzip_types
            text/css
            text/javascript
            text/xml
            text/plain
            text/x-component
            application/javascript
            application/x-javascript
            application/json
            application/xml
            application/rss+xml
            application/atom+xml
            font/truetype
            font/opentype
            application/vnd.ms-fontobject
            image/svg+xml;
    }
    
    # Media files - User uploaded content
    location /media/ {
        alias /home/maxis/epc_parts_store/epcdata/media/;
        expires 30d;
        add_header Cache-Control "public";
        
        # Security: Prevent execution of scripts in media directory
        location ~* \.(php|jsp|asp|aspx|pl|py|sh|cgi)$ {
            deny all;
        }
    }
    
    # Django application - proxy to your development server
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_redirect off;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }
    
    # Robots.txt
    location /robots.txt {
        alias /home/maxis/epc_parts_store/epcdata/staticfiles/robots.txt;
        log_not_found off;
    }
    
    # Security - Block access to sensitive files
    location ~ /\.ht {
        deny all;
    }
    
    location ~ /\.(env|git|svn) {
        deny all;
    }
    
    location ~ /(\.env|\.env\.production|\.prod|manage\.py|requirements.*\.txt)$ {
        deny all;
    }
    
    # Block access to Python files
    location ~* \.(py|pyc|pyo)$ {
        deny all;
    }
    
    # Error pages
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    
    # Logging
    access_log /var/log/nginx/vanparts-direct.access.log;
    error_log /var/log/nginx/vanparts-direct.error.log;
    
    # Client upload limits
    client_max_body_size 10M;
    
    # Gzip compression for dynamic content
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json
        image/svg+xml;
}