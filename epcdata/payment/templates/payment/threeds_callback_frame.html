{% load i18n %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% trans "Processing Payment..." %}</title>
    <style>
        body {
            margin: 0;
            padding: 40px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f5f5f5;
            text-align: center;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 40px;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <h1>{% trans "Processing Your Payment" %}</h1>
        <p>{% trans "Please wait while we complete your payment..." %}</p>
    </div>
    
    <script>
        // If loaded in iframe, notify parent that 3DS is complete
        if (window.parent && window.parent !== window) {
            console.log('3DS callback loaded in iframe - notifying parent');
            window.parent.postMessage({Status: 'SUCCESS'}, '*');
        } else {
            // If loaded directly (not in iframe), process payment
            console.log('3DS callback loaded directly - processing payment');
            // Give Cardinal a moment to finish, then process
            setTimeout(function() {
                window.location.href = window.location.href;
            }, 500);
        }
    </script>
</body>
</html>
