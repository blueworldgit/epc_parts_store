server {
    server_name NEW_DOMAIN.com www.NEW_DOMAIN.com;

    location / {
        proxy_pass http://localhost:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve static files directly
    location /static/ {
        alias /home/USERNAME/epc_parts_store/epcdata/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Serve media files directly
    location /media/ {
        alias /home/USERNAME/epc_parts_store/epcdata/media/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Optional: increase buffer and timeout settings
    client_max_body_size 50M;
    proxy_read_timeout 90;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/NEW_DOMAIN.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/NEW_DOMAIN.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.NEW_DOMAIN.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = NEW_DOMAIN.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name NEW_DOMAIN.com www.NEW_DOMAIN.com;
    return 404; # managed by Certbot
}